document.getElementById('k').innerHTML=[['s',f(D.tot/1e6,2)+'M','Total Sales'],['a',f(D.avg),'Average Sales'],['n',f(D.n),'No. of Items'],['r',D.r.toFixed(1),'Avg Rating']].map(([i,v,l])=>`<div class="kc"><img src="data:image/png;base64,${IC[i]}" alt=""><div><b>${v}</b><span>${l}</span></div></div>`).join('');
const bars=(rows)=>{const m=Math.max(...rows.map(r=>r.s));return rows.map(r=>`<div class="row"><span class="l">${r.k}</span><div class="bar" style="width:${r.s/m*55}%"></div><span class="v">${f(r.s/1000,1)}K · ${(r.s/D.tot*100).toFixed(1)}%</span></div>`).join('')};
const tbl=(rows,h)=>`<table><tr><th>${h}</th><th>Sales</th><th>Avg</th><th>Items</th><th>Rating</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${f(r.s)}</td><td>${f(r.a,1)}</td><td>${f(r.n)}</td><td>${r.r.toFixed(2)}</td></tr>`).join('')}</table>`;
const card=(t,b)=>`<div class="c"><h2>${t}</h2>${b}</div>`;
document.getElementById('g').innerHTML=[
card('Sales by Fat Content',bars(D.fat)+tbl(D.fat,'Fat')),
card('Sales by Item Type',bars(D.type)),
card('Fat Content by Outlet Location',tbl(D.fl.map(r=>({k:r['Outlet Location Type'],s:r['Low Fat'],a:r['Regular'],n:0,r:0})),'Tier').replace('<th>Sales</th><th>Avg</th><th>Items</th><th>Rating</th>','<th>Low Fat</th><th>Regular</th>').replace(/<td>0<\/td><td>0\.00<\/td>/g,'')),
card('Sales by Outlet Establishment Year',bars(D.yr)),
card('% of Sales by Outlet Size',bars(D.size)),
card('Sales by Outlet Location',bars(D.loc)),
card('All Metrics by Outlet Type',tbl(D.otype,'Outlet type')),
card('Key Insights','<ul class="ins"><li>Low Fat items drive 64.6% of sales; avg sale and rating are almost identical to Regular, so the gap is volume.</li><li>Fruits & Veg and Snack Foods lead (~29% combined); Seafood, Breakfast and Starchy Foods trail.</li><li>Supermarket Type1 earns 65.5% of sales; Tier 3 is the biggest location (39%).</li><li>Avg sale (~141) and rating (~3.97) barely move anywhere, so growth must come from item count and outlet mix.</li></ul>')].join('');
